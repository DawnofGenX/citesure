[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citesure"
version = "0.2.1"
description = "MCP citation verifier: check whether an LLM's claims are actually supported by the sources it cites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DawnofGenX" }]
keywords = ["citations", "verification", "mcp", "hallucination", "nli", "fact-checking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
]
# Core runtime deps. The NLI stack (transformers/torch/sentence-transformers) is
# NOT here: it is opt-in via the [nli] extra below, so a plain
# `pip install citesure` stays light and offline.
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.9",
    # trafilatura imports ``lxml.html.clean``; since lxml 5.x that module is a
    # separate distribution. Without it a fresh install (esp. on Python 3.10,
    # where the resolver does not pull it transitively) crashes at import time
    # with ``ImportError: lxml.html.clean ... is now a separate project``.
    # See BUG-8 / evals/INSTALL_MATRIX.md.
    "lxml_html_clean>=0.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
# The NLI tier is opt-in (``--nli``). Its deps are function-local imports in
# src/citesure/nli.py, so the default path must not require them.
nli = [
    "transformers>=4.40",
    "torch>=2.0",
    "sentence-transformers>=2.6",
]
dev = [
    "pytest>=8.0",
    # Required by tests/test_fuzz_{extraction,urls,report}.py, added in d8c7f84.
    # Without this, `pip install -e ".[dev]"` leaves the module missing and the
    # whole suite fails at import on every supported Python (3.10-3.12).
    "hypothesis>=6.0",
    # Eval-harness statistics only (evals/stats.py): Wilson intervals, the
    # cluster bootstrap and the exact McNemar test. Needed by
    # tests/test_eval_stats.py and tests/test_eval_split.py. NOT a runtime
    # dependency of the package itself - the shipped fast path needs neither.
    "scipy>=1.10",
    "numpy>=1.24",
]

[project.scripts]
citesure = "citesure.cli:main"
citesure-mcp = "citesure.mcp_server:main"

[project.urls]
Homepage = "https://github.com/DawnofGenX/citesure"
Repository = "https://github.com/DawnofGenX/citesure"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-network tests are skipped by default; enable with `-m live`.
# NLI model tests (real DeBERTa-v3 weights) are skipped by default; enable
# with `-m nli` once the model has been downloaded (~425 MB).
addopts = '-m "not live and not nli"'
markers = [
    "live: tests that hit the real internet (skipped by default)",
    "nli: tests that require the real NLI cross-encoder weights (skipped by default)",
]
